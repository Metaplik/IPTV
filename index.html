<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>TNT Simple</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  body { margin:0; background:#000; color:#0f0; font-family:sans-serif; text-align:center; padding:10px; }
  video { width:100%; max-width:100%; background:#000; }
  button { padding:15px; margin:5px; font-size:16px; width:90%; background:#111; color:#0f0; border:1px solid #0f0; }
</style>
</head>
<body>

<h2>TNT Direct</h2>
<div id="buttons"></div>
<video id="player" controls autoplay></video>

<script>
const channels = [
  {name: "TF1", url: "https://tf1-hls.akamaized.net/hls/live/2031954/tf1/master.m3u8"},
  {name: "France 2", url: "https://france2-hls.akamaized.net/hls/live/2031949/france2/master.m3u8"},
  {name: "France 3", url: "https://france3-hls.akamaized.net/hls/live/2031950/france3/master.m3u8"},
  {name: "M6", url: "https://m6-hls.akamaized.net/hls/live/2031953/m6/master.m3u8"},
  {name: "Arte", url: "https://arteptweb-a.akamaihd.net/am/ptweb/arte_tvlive_art7/arte_tvlive_art7.m3u8"},
  {name: "BFM TV", url: "https://live.bfmtv.com/bfmtv/hls/live/2036026/bfmtv/bfmtv.m3u8"},
  {name: "France Info", url: "https://stream.france.tv/franceinfo/hls/franceinfo.m3u8"}
];

const container = document.getElementById('buttons');
const video = document.getElementById('player');

channels.forEach(ch => {
  const btn = document.createElement('button');
  btn.textContent = ch.name;
  btn.onclick = () => {
    if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(ch.url);
      hls.attachMedia(video);
    } else {
      video.src = ch.url;
    }
    video.play();
  };
  container.appendChild(btn);
});
</script>

</body>
</html>
