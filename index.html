<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CryptV — IPTV Sécurisé</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  :root {
    --green: #00ff88;
    --green-dim: #00cc66;
    --green-dark: #006633;
    --green-glow: rgba(0,255,136,0.4);
    --bg: #020805;
    --bg2: #050f08;
    --bg3: #081409;
    --border: rgba(0,255,136,0.2);
    --border-bright: rgba(0,255,136,0.6);
    --text: #c8ffe0;
    --text-dim: rgba(200,255,224,0.5);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    cursor: default;
  }

  /* Scanline overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  /* Noise grain */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9998;
    opacity: 0.4;
  }

  /* TOP BAR */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    height: 56px;
    background: linear-gradient(90deg, #020805 0%, #061209 50%, #020805 100%);
    border-bottom: 1px solid var(--border-bright);
    box-shadow: 0 0 20px rgba(0,255,136,0.15), inset 0 -1px 0 rgba(0,255,136,0.3);
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }

  .topbar-logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .topbar-logo img {
    height: 36px;
    width: auto;
    object-fit: contain;
    filter: drop-shadow(0 0 8px var(--green-glow));
  }

  .brand-text {
    font-family: 'Orbitron', monospace;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 4px;
    color: var(--green);
    text-shadow: 0 0 15px var(--green-glow), 0 0 30px rgba(0,255,136,0.2);
  }

  .brand-sub {
    font-size: 9px;
    letter-spacing: 6px;
    color: var(--text-dim);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 300;
    text-transform: uppercase;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 2s ease-in-out infinite;
  }

  .status-dot.inactive { background: #333; box-shadow: none; animation: none; }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--green); }
    50% { opacity: 0.4; box-shadow: 0 0 4px var(--green); }
  }

  .status-text {
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--text-dim);
  }

  /* MAIN LAYOUT */
  .main-layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* SIDEBAR */
  .sidebar {
    width: 300px;
    flex-shrink: 0;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .sidebar::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 1px; height: 100%;
    background: linear-gradient(180deg, var(--green-glow) 0%, transparent 100%);
  }

  /* SEARCH ZONE */
  .search-zone {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    background: var(--bg3);
    position: relative;
  }

  .search-label {
    font-family: 'Orbitron', monospace;
    font-size: 8px;
    letter-spacing: 3px;
    color: var(--green-dim);
    margin-bottom: 6px;
    display: block;
  }

  .search-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .search-icon {
    position: absolute;
    left: 10px;
    color: var(--green-dim);
    font-size: 13px;
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    background: rgba(0,0,0,0.5);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 8px 10px 8px 32px;
    color: var(--green);
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .search-input:focus {
    border-color: var(--green);
    box-shadow: 0 0 12px rgba(0,255,136,0.2), inset 0 0 8px rgba(0,255,136,0.05);
  }

  .search-input::placeholder { color: rgba(0,255,136,0.3); font-size: 12px; }

  .search-shortcut {
    position: absolute;
    right: 8px;
    background: rgba(0,255,136,0.1);
    border: 1px solid var(--border);
    padding: 2px 6px;
    border-radius: 2px;
    font-size: 9px;
    color: var(--text-dim);
    font-family: 'Orbitron', monospace;
    letter-spacing: 1px;
  }

  /* CHANNEL STATS */
  .channel-stats {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(0,0,0,0.2);
  }

  .stat-item {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .stat-num {
    font-family: 'Orbitron', monospace;
    font-size: 16px;
    font-weight: 700;
    color: var(--green);
    text-shadow: 0 0 8px var(--green-glow);
    line-height: 1;
  }

  .stat-label {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .load-btn {
    background: transparent;
    border: 1px solid var(--green);
    color: var(--green);
    font-family: 'Orbitron', monospace;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 6px 14px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.25s;
    text-transform: uppercase;
  }

  .load-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--green);
    transform: translateX(-100%);
    transition: transform 0.25s;
  }

  .load-btn:hover::before { transform: translateX(0); }
  .load-btn:hover { color: #000; box-shadow: 0 0 20px var(--green-glow); }
  .load-btn span { position: relative; z-index: 1; }

  /* CHANNEL LIST */
  .channel-list {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
  }

  .channel-list::-webkit-scrollbar { width: 4px; }
  .channel-list::-webkit-scrollbar-track { background: transparent; }
  .channel-list::-webkit-scrollbar-thumb { background: var(--green-dark); border-radius: 2px; }
  .channel-list::-webkit-scrollbar-thumb:hover { background: var(--green-dim); }

  .channel-group-header {
    padding: 6px 12px;
    background: rgba(0,255,136,0.05);
    border-bottom: 1px solid var(--border);
    border-top: 1px solid var(--border);
    font-family: 'Orbitron', monospace;
    font-size: 8px;
    letter-spacing: 3px;
    color: var(--green-dim);
    text-transform: uppercase;
    position: sticky;
    top: 0;
    z-index: 2;
    backdrop-filter: blur(4px);
  }

  .channel-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    cursor: pointer;
    border-bottom: 1px solid rgba(0,255,136,0.05);
    transition: background 0.15s, border-color 0.15s;
    position: relative;
    overflow: hidden;
  }

  .channel-item::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: var(--green);
    transform: scaleY(0);
    transition: transform 0.15s;
    box-shadow: 2px 0 8px var(--green-glow);
  }

  .channel-item:hover { background: rgba(0,255,136,0.06); }
  .channel-item:hover::before { transform: scaleY(1); }

  .channel-item.active {
    background: rgba(0,255,136,0.1);
    border-bottom-color: rgba(0,255,136,0.15);
  }
  .channel-item.active::before { transform: scaleY(1); }

  .ch-num {
    font-family: 'Orbitron', monospace;
    font-size: 9px;
    color: var(--green-dark);
    width: 24px;
    text-align: right;
    flex-shrink: 0;
  }

  .ch-icon {
    width: 28px; height: 28px;
    border-radius: 4px;
    background: rgba(0,255,136,0.08);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    overflow: hidden;
  }

  .ch-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .ch-info { flex: 1; min-width: 0; }

  .ch-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: 0.5px;
    line-height: 1.2;
  }

  .ch-meta {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
    margin-top: 2px;
  }

  .ch-status {
    width: 6px; height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .ch-status.ok { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .ch-status.unknown { background: #444; }

  /* PLAYER AREA */
  .player-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #000;
    position: relative;
  }

  .video-wrap {
    flex: 1;
    position: relative;
    background: #000;
    overflow: hidden;
  }

  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  /* Empty state */
  .empty-state {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: radial-gradient(ellipse at center, #061209 0%, #000 70%);
  }

  .empty-logo {
    font-family: 'Orbitron', monospace;
    font-size: 48px;
    font-weight: 900;
    color: rgba(0,255,136,0.08);
    letter-spacing: 8px;
    user-select: none;
  }

  .empty-msg {
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    letter-spacing: 4px;
    color: rgba(0,255,136,0.3);
    text-transform: uppercase;
  }

  .empty-state .grid-lines {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* PLAYER INFO BAR */
  .player-info {
    height: 44px;
    background: linear-gradient(90deg, var(--bg3), var(--bg2));
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 16px;
    flex-shrink: 0;
  }

  .now-playing-label {
    font-family: 'Orbitron', monospace;
    font-size: 8px;
    letter-spacing: 3px;
    color: var(--green-dim);
    flex-shrink: 0;
  }

  .now-playing-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 1px;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .player-status {
    font-family: 'Orbitron', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--text-dim);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* LOADING OVERLAY */
  .loading-overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.85);
    flex-direction: column;
    gap: 16px;
    z-index: 5;
  }

  .loading-overlay.visible { display: flex; }

  .spinner {
    width: 48px; height: 48px;
    border: 2px solid rgba(0,255,136,0.15);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    box-shadow: 0 0 20px rgba(0,255,136,0.2);
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    letter-spacing: 4px;
    color: var(--green);
    text-shadow: 0 0 10px var(--green-glow);
    animation: blink 1s step-end infinite;
  }

  @keyframes blink { 50% { opacity: 0.3; } }

  /* ERROR TOAST */
  .toast {
    position: fixed;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(255,50,50,0.15);
    border: 1px solid rgba(255,50,50,0.4);
    color: #ff6666;
    font-family: 'Orbitron', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    padding: 10px 20px;
    border-radius: 3px;
    opacity: 0;
    transition: all 0.3s;
    z-index: 100;
    pointer-events: none;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Keyboard shortcut hint */
  .shortcut-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 9px;
    letter-spacing: 1px;
    color: var(--text-dim);
    background: rgba(0,255,136,0.06);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 2px 6px;
  }

  /* Highlight match */
  .highlight { color: var(--green); font-weight: 700; }

  /* Corner decorations */
  .corner-tl, .corner-br {
    position: absolute;
    width: 12px; height: 12px;
    border-color: var(--green);
    border-style: solid;
    opacity: 0.4;
  }
  .corner-tl { top: 6px; left: 6px; border-width: 1px 0 0 1px; }
  .corner-br { bottom: 6px; right: 6px; border-width: 0 1px 1px 0; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-logo">
    <img id="logo-img" src="" alt="CryptV"/>
    <div>
      <div class="brand-text">CRYPTV</div>
      <div class="brand-sub">Secure · Encrypted · Stream</div>
    </div>
  </div>
  <div class="topbar-right">
    <span class="shortcut-badge">⌃F RECHERCHE RAPIDE</span>
    <div class="status-dot inactive" id="status-dot"></div>
    <div class="status-text" id="status-label">EN ATTENTE</div>
  </div>
</div>

<!-- MAIN -->
<div class="main-layout">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="corner-tl"></div>
    <div class="corner-br"></div>

    <!-- SEARCH -->
    <div class="search-zone">
      <span class="search-label">// RECHERCHE DE CHAÎNE</span>
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input class="search-input" id="search" placeholder="Nom de la chaîne..." autocomplete="off" spellcheck="false"/>
        <span class="search-shortcut">⌃F</span>
      </div>
    </div>

    <!-- STATS + LOAD -->
    <div class="channel-stats">
      <div class="stat-item">
        <span class="stat-num" id="total-count">—</span>
        <span class="stat-label">Chaînes</span>
      </div>
      <div class="stat-item">
        <span class="stat-num" id="found-count">—</span>
        <span class="stat-label">Résultats</span>
      </div>
      <button class="load-btn" onclick="loadM3U()"><span>⟳ CHARGER</span></button>
    </div>

    <!-- LIST -->
    <div class="channel-list" id="list"></div>
  </div>

  <!-- PLAYER -->
  <div class="player-area">
    <div class="video-wrap">
      <div class="empty-state" id="empty-state">
        <div class="grid-lines"></div>
        <div class="empty-logo">CRYPTV</div>
        <div class="empty-msg">Chargez les chaînes pour commencer</div>
      </div>
      <div class="loading-overlay" id="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text">CONNEXION EN COURS...</div>
      </div>
      <video id="player" controls autoplay playsinline></video>
    </div>
    <div class="player-info">
      <span class="now-playing-label">▶ EN LECTURE</span>
      <span class="now-playing-name" id="now-playing">Sélectionnez une chaîne</span>
      <div class="player-status" id="player-status">
        <div class="status-dot inactive" id="vid-dot"></div>
        <span id="vid-label">INACTIF</span>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

let allChannels = [];
let filteredChannels = [];
let currentHls = null;
let activeEl = null;

// Keyboard shortcut Ctrl+F
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
    e.preventDefault();
    document.getElementById('search').focus();
    document.getElementById('search').select();
  }
});

// Real-time search
document.getElementById('search').addEventListener('input', filterChannels);

async function loadM3U() {
  setStatus('CHARGEMENT...', true);
  showToast('');

  const URL = 'https://iptv-org.github.io/iptv/index.m3u';

  try {
    const res = await fetch(URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    parseM3U(text);
    setStatus('OPÉRATIONNEL', true);
    showToast('');
  } catch (e) {
    setStatus('ERREUR', false);
    showToast('Impossible de charger le flux : ' + e.message);
  }
}

function parseM3U(text) {
  const lines = text.split('\n');
  allChannels = [];
  let currentMeta = {};

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (line.startsWith('#EXTINF')) {
      currentMeta = {};
      // Parse name
      const namePart = line.split(',').slice(1).join(',').trim();
      currentMeta.name = namePart || 'Chaîne inconnue';
      // Parse logo
      const logoMatch = line.match(/tvg-logo="([^"]*)"/);
      currentMeta.logo = logoMatch ? logoMatch[1] : '';
      // Parse group
      const groupMatch = line.match(/group-title="([^"]*)"/);
      currentMeta.group = groupMatch ? groupMatch[1] : 'Autres';
      // Parse language
      const langMatch = line.match(/tvg-language="([^"]*)"/);
      currentMeta.lang = langMatch ? langMatch[1] : '';
    } else if (line.startsWith('http')) {
      if (currentMeta.name) {
        allChannels.push({ ...currentMeta, url: line });
        currentMeta = {};
      }
    }
  }

  document.getElementById('total-count').textContent = allChannels.length.toLocaleString();
  filteredChannels = allChannels;
  renderList(allChannels, '');
}

function filterChannels() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  if (!q) {
    filteredChannels = allChannels;
    document.getElementById('found-count').textContent = allChannels.length.toLocaleString();
    renderList(allChannels, '');
  } else {
    filteredChannels = allChannels.filter(c => c.name.toLowerCase().includes(q));
    document.getElementById('found-count').textContent = filteredChannels.length.toLocaleString();
    renderList(filteredChannels, q);
  }
}

function renderList(channels, query) {
  const list = document.getElementById('list');
  if (channels.length === 0) {
    list.innerHTML = `<div style="padding:30px;text-align:center;color:var(--text-dim);font-family:'Orbitron',monospace;font-size:10px;letter-spacing:3px;">AUCUN RÉSULTAT</div>`;
    return;
  }

  // Group by group-title (max 3000 for perf)
  const shown = channels.slice(0, 3000);
  const groups = {};
  for (const ch of shown) {
    const g = ch.group || 'Autres';
    if (!groups[g]) groups[g] = [];
    groups[g].push(ch);
  }

  const frag = document.createDocumentFragment();
  let idx = 0;

  for (const [groupName, chs] of Object.entries(groups)) {
    const header = document.createElement('div');
    header.className = 'channel-group-header';
    header.textContent = `// ${groupName} (${chs.length})`;
    frag.appendChild(header);

    for (const ch of chs) {
      idx++;
      const div = document.createElement('div');
      div.className = 'channel-item';

      const numEl = document.createElement('span');
      numEl.className = 'ch-num';
      numEl.textContent = String(idx).padStart(3, '0');

      const iconEl = document.createElement('div');
      iconEl.className = 'ch-icon';
      if (ch.logo) {
        const img = document.createElement('img');
        img.src = ch.logo;
        img.onerror = () => { iconEl.textContent = getEmoji(ch.name); };
        iconEl.appendChild(img);
      } else {
        iconEl.textContent = getEmoji(ch.name);
      }

      const infoEl = document.createElement('div');
      infoEl.className = 'ch-info';

      const nameEl = document.createElement('div');
      nameEl.className = 'ch-name';
      nameEl.innerHTML = query ? highlight(ch.name, query) : escapeHtml(ch.name);

      const metaEl = document.createElement('div');
      metaEl.className = 'ch-meta';
      metaEl.textContent = ch.lang ? ch.lang.toUpperCase() : 'STREAM';

      infoEl.appendChild(nameEl);
      infoEl.appendChild(metaEl);

      const statusEl = document.createElement('div');
      statusEl.className = 'ch-status unknown';

      div.appendChild(numEl);
      div.appendChild(iconEl);
      div.appendChild(infoEl);
      div.appendChild(statusEl);

      div.addEventListener('click', () => playChannel(ch, div));
      frag.appendChild(div);
    }
  }

  list.innerHTML = '';
  list.appendChild(frag);

  if (channels.length > 3000) {
    const note = document.createElement('div');
    note.style.cssText = 'padding:12px;text-align:center;color:var(--text-dim);font-size:10px;letter-spacing:2px;';
    note.textContent = `+ ${(channels.length - 3000).toLocaleString()} autres — affinez la recherche`;
    list.appendChild(note);
  }

  document.getElementById('found-count').textContent = channels.length.toLocaleString();
}

function playChannel(ch, el) {
  // Update active state
  if (activeEl) activeEl.classList.remove('active');
  el.classList.add('active');
  activeEl = el;

  const video = document.getElementById('player');
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('now-playing').textContent = ch.name;

  showLoading(true);

  if (currentHls) { currentHls.destroy(); currentHls = null; }

  const url = ch.url;

  if (Hls.isSupported() && (url.includes('.m3u8') || url.includes('m3u8'))) {
    const hls = new Hls({ enableWorker: true, lowLatencyMode: true });
    currentHls = hls;
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      showLoading(false);
      setVidStatus(true);
      video.play().catch(() => {});
    });
    hls.on(Hls.Events.ERROR, (e, data) => {
      if (data.fatal) {
        showLoading(false);
        setVidStatus(false);
        showToast('Flux indisponible : ' + ch.name);
      }
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = url;
    video.addEventListener('loadedmetadata', () => { showLoading(false); setVidStatus(true); }, { once: true });
    video.addEventListener('error', () => { showLoading(false); setVidStatus(false); showToast('Flux indisponible'); }, { once: true });
    video.play().catch(() => {});
  } else {
    video.src = url;
    video.addEventListener('playing', () => { showLoading(false); setVidStatus(true); }, { once: true });
    video.addEventListener('error', () => { showLoading(false); setVidStatus(false); showToast('Flux indisponible'); }, { once: true });
    video.play().catch(() => { showLoading(false); });
  }

  setTimeout(() => { if (document.getElementById('loading-overlay').classList.contains('visible')) showLoading(false); }, 12000);
}

function getEmoji(name) {
  const n = name.toLowerCase();
  if (n.includes('sport') || n.includes('foot') || n.includes('canal')) return '⚽';
  if (n.includes('news') || n.includes('info') || n.includes('actu')) return '📡';
  if (n.includes('music') || n.includes('musique')) return '🎵';
  if (n.includes('kids') || n.includes('enfant') || n.includes('cartoon')) return '🎠';
  if (n.includes('movie') || n.includes('film') || n.includes('cinema')) return '🎬';
  if (n.includes('doc') || n.includes('national')) return '🌍';
  return '📺';
}

function highlight(text, query) {
  const escaped = escapeHtml(text);
  const re = new RegExp('(' + escapeRegex(query) + ')', 'gi');
  return escaped.replace(re, '<span class="highlight">$1</span>');
}

function escapeHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function escapeRegex(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function showLoading(show) {
  const el = document.getElementById('loading-overlay');
  if (show) el.classList.add('visible');
  else el.classList.remove('visible');
}

function setStatus(msg, ok) {
  document.getElementById('status-label').textContent = msg;
  const dot = document.getElementById('status-dot');
  dot.className = 'status-dot' + (ok ? '' : ' inactive');
}

function setVidStatus(ok) {
  const dot = document.getElementById('vid-dot');
  dot.className = 'status-dot' + (ok ? '' : ' inactive');
  document.getElementById('vid-label').textContent = ok ? 'EN DIRECT' : 'ERREUR';
}

let toastTimeout;
function showToast(msg) {
  if (!msg) return;
  const t = document.getElementById('toast');
  t.textContent = '⚠ ' + msg.toUpperCase();
  t.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => t.classList.remove('show'), 5000);
}
</script>
</body>
</html>
